<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Te extraño, Mei</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Archivo+Black&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap">
<style>
/* Layout: una (celu) o varias tiras verticales del video, desfasadas en el tiempo; texto gigante encima. */
:root{
  --night:#0b0709;
  --ink:#fff6f2;
  --rose:#ff4f7b;
  --rose-soft:#ff9fb6;
  --glow:rgba(255,79,123,.55);
  --display:"Archivo Black","Arial Black",system-ui,sans-serif;
  --heart-font:"Dela Gothic One","Arial Black",Impact,system-ui,sans-serif;
  --body:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;}
body{background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden;}

.stage{position:fixed;inset:0;overflow:hidden;background:var(--night);}

/* tiras de video */
.strips{position:absolute;inset:0;display:flex;justify-content:center;align-items:stretch;gap:0;}
.strip{position:relative;flex:0 0 auto;height:100%;overflow:hidden;
  opacity:0;transform:translateY(var(--from,100%));
  animation:stripIn 1.1s cubic-bezier(.2,.9,.2,1) forwards;animation-delay:var(--d,0s);}
.strip video{width:100%;height:100%;object-fit:cover;display:block;}
.strip.side video{filter:saturate(.75) brightness(.55);}
.strip.side::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,7,9,.35),rgba(255,79,123,.08) 50%,rgba(11,7,9,.45));}
.strip + .strip{box-shadow:-1px 0 0 rgba(255,246,242,.08);}
@keyframes stripIn{to{opacity:1;transform:translateY(0);}}

/* una sola tira: ocupa todo */
.strips.single .strip{width:100% !important;}

/* viñeta para que el texto se lea siempre */
.veil{position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 80% 55% at 50% 50%,rgba(11,7,9,.15),rgba(11,7,9,.65) 100%),
    linear-gradient(180deg,rgba(11,7,9,.35),transparent 30%,transparent 70%,rgba(11,7,9,.55));}

/* flash al entrar */
.flash{position:absolute;inset:0;background:var(--rose);mix-blend-mode:screen;opacity:0;pointer-events:none;
  animation:flash .9s ease-out 1.55s forwards;}
@keyframes flash{0%{opacity:0}12%{opacity:.55}100%{opacity:0}}

/* texto */
.msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  text-align:center;pointer-events:none;}
.shake{animation:shake .5s ease-out 1.55s both;}
@keyframes shake{
  0%{transform:translate(0,0)}15%{transform:translate(-6px,4px)}30%{transform:translate(5px,-5px)}
  45%{transform:translate(-4px,2px)}60%{transform:translate(3px,-2px)}100%{transform:translate(0,0)}}

h1{margin:0;font-family:var(--display);font-weight:400;line-height:.86;letter-spacing:-.01em;
  font-size:min(13vw,19vh);text-transform:lowercase;
  display:flex;flex-direction:column;align-items:center;
  text-shadow:0 .04em 0 rgba(11,7,9,.5),0 0 .35em rgba(11,7,9,.55);}
.line{display:flex;justify-content:center;}
.ch{display:inline-block;opacity:0;transform:translateY(60%);
  animation:rise-in .8s cubic-bezier(.22,1,.36,1) forwards;animation-delay:calc(1.2s + var(--i) * .05s);}
@keyframes rise-in{
  0%{opacity:0;transform:translateY(60%);}
  100%{opacity:1;transform:none;}}

/* después de entrar: respiración suave en bucle */
.line.live .ch{animation:float 3.2s ease-in-out infinite;animation-delay:calc(var(--i) * -.18s);opacity:1;transform:none;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-.04em)}}

.heart{display:block;margin-top:.12em;color:var(--rose);font-family:var(--heart-font);
  font-size:min(24vw,26vh);line-height:.8;letter-spacing:-.04em;
  opacity:0;transform:scale(3);
  animation:heartIn .55s cubic-bezier(.2,1.8,.4,1) 1.95s forwards;}
@keyframes heartIn{to{opacity:1;transform:scale(1)}}
.heart.live{opacity:1;transform:none;animation:beat 1.4s ease-in-out infinite;}
@keyframes beat{
  0%,100%{transform:scale(1);text-shadow:0 0 .12em var(--glow),0 0 .5em rgba(11,7,9,.6);}
  14%{transform:scale(1.16);text-shadow:0 0 .3em var(--glow),0 0 .8em var(--glow);}
  28%{transform:scale(1.02);}
  42%{transform:scale(1.12);text-shadow:0 0 .25em var(--glow),0 0 .6em var(--glow);}
  70%{transform:scale(1);}}

.to{margin-top:1.4rem;font-family:var(--body);font-weight:700;font-size:clamp(.85rem,2.6vw,1.05rem);
  letter-spacing:.38em;text-transform:uppercase;color:var(--rose-soft);
  opacity:0;animation:fade .8s ease 2.6s forwards;}
@keyframes fade{to{opacity:.9}}

/* chispitas que suben en bucle */
.sparks{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.spark{position:absolute;bottom:-40px;font-family:var(--display);color:var(--rose);opacity:0;
  animation:rise var(--t,9s) linear infinite;animation-delay:var(--d,0s);}
@keyframes rise{
  0%{transform:translate(0,0) rotate(0);opacity:0}
  10%{opacity:var(--o,.6)}
  85%{opacity:var(--o,.6)}
  100%{transform:translate(var(--x,0px),-115vh) rotate(var(--rot,20deg));opacity:0}}

/* botón de sonido */
.sound{position:absolute;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:.5rem;padding:.6rem 1rem;border-radius:999px;
  background:rgba(11,7,9,.55);color:var(--ink);border:1px solid rgba(255,246,242,.22);
  font:700 .8rem/1 var(--body);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  opacity:0;animation:fade .8s ease 3s forwards;}
.sound:focus-visible{outline:2px solid var(--rose);outline-offset:3px;}
.sound svg{width:16px;height:16px;fill:currentColor;}

@media (prefers-reduced-motion:reduce){
  .strip,.ch,.heart,.to,.sound{animation:none !important;opacity:1 !important;transform:none !important;}
  .flash,.sparks{display:none;}
  .shake{animation:none;}
}
</style>

<div class="stage" id="stage">
  <div class="strips" id="strips"></div>
  <div class="veil"></div>
  <div class="sparks" id="sparks" aria-hidden="true"></div>
  <div class="msg">
    <div>
      <h1 aria-label="te extraño">
        <span class="line" id="l1"></span>
        <span class="line" id="l2"></span>
      </h1>
      <span class="heart" id="heart" aria-label="corazón">&lt;3</span>
    </div>
  </div>
  <button class="sound" id="sound" type="button" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path id="wave" d="M16.5 12a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z" opacity=".35"/></svg>
    <span id="soundLabel">Con sonido</span>
  </button>
</div>

<script>
(function(){
  var SRC = "mei.mp4", POSTER = "poster.jpg", DURATION = 23.9;
  var strips = document.getElementById('strips');
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var videos = [], main = null;

  /* letras */
  function spell(el, word, start){
    word.split('').forEach(function(c, k){
      var s = document.createElement('span');
      s.className = 'ch';
      s.textContent = c;
      s.style.setProperty('--i', start + k);
      s.style.setProperty('--r', ((k % 2 ? 1 : -1) * (8 + (k * 7) % 14)) + 'deg');
      el.appendChild(s);
    });
  }
  spell(document.getElementById('l1'), 'te', 0);
  spell(document.getElementById('l2'), 'extraño', 2);

  /* cuando terminan de entrar, pasan al bucle */
  setTimeout(function(){
    document.getElementById('l1').classList.add('live');
    document.getElementById('l2').classList.add('live');
  }, reduce ? 0 : 2300);
  setTimeout(function(){ document.getElementById('heart').classList.add('live'); }, reduce ? 0 : 2550);

  /* tiras de video según el ancho de pantalla */
  function build(){
    var W = innerWidth, H = innerHeight;
    var stripW = H * 9 / 16;
    var n = Math.ceil(W / stripW);
    if (n % 2 === 0) n += 1;            // siempre impar, así hay una del medio
    if (W / H < 0.9) n = 1;             // celular / vertical: una sola, pantalla completa
    n = Math.min(n, 7);

    var muted = !main || main.muted;
    strips.innerHTML = '';
    videos = [];
    strips.classList.toggle('single', n === 1);
    var mid = Math.floor(n / 2);
    for (var i = 0; i < n; i++){
      var dist = i - mid;
      var wrap = document.createElement('div');
      wrap.className = 'strip' + (dist === 0 ? ' center' : ' side');
      if (n > 1) wrap.style.width = stripW + 'px';
      wrap.style.setProperty('--from', (i % 2 ? '-100%' : '100%'));
      wrap.style.setProperty('--d', (Math.abs(dist) * 0.14) + 's');
      var v = document.createElement('video');
      v.src = SRC; v.poster = POSTER;
      v.muted = true; v.loop = true; v.autoplay = true; v.playsInline = true;
      v.setAttribute('playsinline',''); v.setAttribute('muted',''); v.preload = 'auto';
      if (dist !== 0){
        var offset = ((dist * 4.7) % DURATION + DURATION) % DURATION; // cada tira desfasada
        v.addEventListener('loadedmetadata', (function(vv, o){ return function(){ try{ vv.currentTime = o; }catch(e){} }; })(v, offset), {once:true});
        if (Math.abs(dist) > 1) v.playbackRate = 0.9;
      } else {
        main = v;
        v.muted = muted;
      }
      wrap.appendChild(v);
      strips.appendChild(wrap);
      videos.push(v);
      var p = v.play(); if (p && p.catch) p.catch(function(){});
    }
  }
  build();
  var lastN = null, t;
  addEventListener('resize', function(){
    clearTimeout(t);
    t = setTimeout(function(){
      var W = innerWidth, H = innerHeight;
      var n = W / H < 0.9 ? 1 : Math.min(7, (function(x){ return x % 2 ? x : x + 1; })(Math.ceil(W / (H * 9 / 16))));
      if (n !== lastN){ lastN = n; build(); }
      else { document.querySelectorAll('.strip').forEach(function(s){ if (n > 1) s.style.width = (H * 9 / 16) + 'px'; }); }
    }, 180);
  });
  lastN = strips.children.length;

  /* si el navegador bloquea el autoplay, arranca al primer toque */
  function kick(){ videos.forEach(function(v){ if (v.paused){ var p = v.play(); if (p && p.catch) p.catch(function(){}); } }); }
  document.addEventListener('pointerdown', kick, {passive:true});
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) kick(); });

  /* sonido */
  var btn = document.getElementById('sound'), label = document.getElementById('soundLabel'), wave = document.getElementById('wave');
  btn.addEventListener('click', function(){
    if (!main) return;
    main.muted = !main.muted;
    if (!main.muted){ var p = main.play(); if (p && p.catch) p.catch(function(){}); }
    btn.setAttribute('aria-pressed', String(!main.muted));
    label.textContent = main.muted ? 'Con sonido' : 'Sin sonido';
    wave.setAttribute('opacity', main.muted ? '.35' : '1');
  });

  /* corazoncitos <3 que suben */
  if (!reduce){
    var sp = document.getElementById('sparks');
    var count = innerWidth < 600 ? 10 : 18;
    for (var i = 0; i < count; i++){
      var s = document.createElement('span');
      s.className = 'spark';
      s.textContent = '<3';
      var size = 12 + Math.random() * 26;
      s.style.left = (Math.random() * 100) + '%';
      s.style.fontSize = size + 'px';
      s.style.setProperty('--t', (8 + Math.random() * 8) + 's');
      s.style.setProperty('--d', (2.5 + Math.random() * 10) + 's');
      s.style.setProperty('--x', ((Math.random() - .5) * 120) + 'px');
      s.style.setProperty('--rot', ((Math.random() - .5) * 60) + 'deg');
      s.style.setProperty('--o', (.25 + Math.random() * .45).toFixed(2));
      sp.appendChild(s);
    }
  }
})();
</script>

</html>
